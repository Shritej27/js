<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Experiment 3 - String Reverse, Replace and Palindrome (Manual Loops)</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Experiment 3: String Operations</h1>
    <input type="text" id="textInput" placeholder="Enter string">
    <br>
    <button onclick="reverseText()">Reverse</button>
    <br><br>
    <input type="text" id="oldChar" maxlength="1" placeholder="Old character">
    <input type="text" id="newChar" maxlength="1" placeholder="New character">
    <button onclick="replaceChar()">Replace Character</button>
    <br><br>
    <button onclick="checkPalindrome()">Check Palindrome</button>
    <button onclick="resetPage()">Reset</button>
    <p id="result"></p>
  </div>
  <script src="script.js"></script>
</body>
</html>
